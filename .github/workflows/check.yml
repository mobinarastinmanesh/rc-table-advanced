name: Package checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        react: ['18.3.1', '19.2.4']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix example
      - run: npm run lint
      - if: matrix.react == '19.2.4'
        run: npm test
      - if: matrix.react == '18.3.1'
        run: npm run test:react18
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-coverage-react-${{ matrix.react }}
          path: coverage/
          if-no-files-found: warn
      - run: npm run coverage:check
      - run: git diff --exit-code -- README.md docs/testing.md docs/coverage-summary.json
      - run: npm run test:package
        env:
          RCTA_REACT_VERSION: ${{ matrix.react }}
      - run: npm run build:docs
      - if: matrix.react == '19.2.4'
        run: npm run test:next
      - if: matrix.react == '19.2.4'
        run: npx playwright install --with-deps chromium
      - if: matrix.react == '19.2.4'
        run: npm run test:browser
      - run: npm audit --omit=dev
